<!DOCTYPE html>
<html>
<head>
  <title>Onchain Diary</title>
</head>
<body>
  <h2>Onchain Diary</h2>

  <button onclick="connect()">Connect Wallet</button>
  <br><br>

  <textarea id="text" placeholder="Write something..." rows="4" cols="50"></textarea>
  <br><br>

  <button onclick="write()">Write Entry</button>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.6.2/dist/ethers.min.js"></script>

  <script>
    const contractAddress = "0x69e0b2eCD3F86559E408b22934f9517f14EB2324";

    const abi = [
      "function writeEntry(string calldata _content) external"
    ];

    let signer;
    let contract;

    async function connect() {
      const provider = new ethers.BrowserProvider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = await provider.getSigner();
      contract = new ethers.Contract(contractAddress, abi, signer);
      alert("Connected");
    }

    async function write() {
      const text = document.getElementById("text").value;
      if (!text) return alert("Empty");

      const tx = await contract.writeEntry(text);
      await tx.wait();

      alert("Saved onchain!");
    }
  </script>
</body>
</html>
